<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gestión Clínica</title>
  <link rel="stylesheet" href="css/estilo.css" />
</head>
<body>
  <h1>Gestión de Médicos</h1>
  <button class="btn-crear" onclick="abrirModalCrearMedico()">➕ Crear Médico</button>
  <table>
    <thead>
      <tr>
        <th>ID</th><th>Nombre</th><th>Especialidad</th><th>Teléfono</th><th>Correo</th><th>Dirección</th><th>Acciones</th>
      </tr>
    </thead>
    <tbody id="tabla-medicos"></tbody>
  </table>

  <div class="modal" id="modal-medico">
    <div class="modal-content">
      <span class="close-modal" onclick="cerrarModalMedico()">×</span>
      <h2 id="modal-titulo-medico">Crear Médico</h2>
      <input type="text" id="t1-medico" placeholder="Nombre" />
      <input type="text" id="t2-medico" placeholder="Especialidad" />
      <input type="text" id="t3-medico" placeholder="Teléfono" />
      <input type="email" id="t4-medico" placeholder="Correo" />
      <input type="text" id="t5-medico" placeholder="Dirección" />
      <div class="modal-actions">
        <button onclick="guardarMedico()" class="btn-crear">Guardar</button>
      </div>
    </div>
  </div>

  <hr />

  <h1>Gestión de Pacientes</h1>
  <button class="btn-crear" onclick="abrirModalCrearPaciente()">➕ Crear Paciente</button>
  <table>
    <thead>
      <tr>
        <th>ID</th><th>Documento</th><th>Nombre</th><th>Teléfono</th><th>Correo</th><th>Dirección</th><th>Acciones</th>
      </tr>
    </thead>
    <tbody id="tabla-pacientes"></tbody>
  </table>

  <div class="modal" id="modal-paciente">
    <div class="modal-content">
      <span class="close-modal" onclick="cerrarModalPaciente()">×</span>
      <h2 id="modal-titulo-paciente">Crear Paciente</h2>
      <input type="text" id="t1-paciente" placeholder="Documento" />
      <input type="text" id="t2-paciente" placeholder="Nombre" />
      <input type="text" id="t3-paciente" placeholder="Teléfono" />
      <input type="email" id="t4-paciente" placeholder="Correo" />
      <input type="text" id="t5-paciente" placeholder="Dirección" />
      <div class="modal-actions">
        <button onclick="guardarPaciente()" class="btn-crear">Guardar</button>
      </div>
    </div>
  </div>

  <script src="js/main.js"></script>
</body>
</html>
